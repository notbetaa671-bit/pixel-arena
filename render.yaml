services:
  - type: web
    name: pixel-arena-server-beta
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CLIENT_ORIGIN
        value: "*"
      - key: ROOM_MAX_PLAYERS
        value: "20"

  - type: web
    name: pixel-arena-client-beta
    runtime: static
    rootDir: client
    buildCommand: echo "No build required"
    staticPublishPath: .

